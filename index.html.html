<!DOCTYPE html>
<html lang="es" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Deudores</title>
<style>
:root{--bg:#fbf4e6;--card:#fffdf8;--tx:#2b1a14;--mu:#7a6a5c;--pr:#9d1c1c;--on:#fff;--go:#e0a826;--gt:#3a1208;--de:#b8271f;--pa:#1f7a4d;--ln:#e6d9bc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111815;--card:#1a2420;--tx:#e6ede8;--mu:#93a299;--pr:#4fc3c9;--on:#082a2d;--de:#ff8a7a;--pa:#63d99b;--ln:#2c3a34}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111815;--card:#1a2420;--tx:#e6ede8;--mu:#93a299;--pr:#4fc3c9;--on:#082a2d;--de:#ff8a7a;--pa:#63d99b;--ln:#2c3a34}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:19px;line-height:1.4}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:120px}
header{display:flex;align-items:center;gap:8px;padding:16px;border-bottom:4px solid var(--go,#e0a826);position:sticky;top:0;background:var(--pr);color:var(--on);z-index:5}
header .ib{background:rgba(255,255,255,.18);color:var(--on);border-color:rgba(255,255,255,.45)}
header h1{flex:1;margin:0;font-size:1.4rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;cursor:pointer}
.ib{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:8px 14px;min-height:48px;font-size:1.05rem}
.bt{background:var(--go,#e0a826);color:var(--gt,#3a1208);border:0;border-radius:12px;padding:16px 18px;font-weight:700;min-height:60px;font-size:1.05rem}
.bt.s{background:none;color:var(--tx);border:1px solid var(--ln)}
.bt.r{background:var(--de);color:#fff}
.tot{margin:16px;padding:20px 18px;background:var(--card);border:1px solid var(--ln);border-left:8px solid var(--go,#e0a826);border-radius:6px}
.tot small{color:var(--mu);display:block}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.tot .num{font-size:2.5rem;color:var(--de)}
input{font:inherit;width:100%;padding:16px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx)}
.q{margin:0 16px 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 16px;border-bottom:1px solid var(--ln);background:var(--card);width:100%;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--tx)}
.row:nth-child(even){background:var(--bg)}
.row .n{font-weight:600}
.d{color:var(--de)}.p{color:var(--pa)}
.empty{padding:32px 16px;text-align:center;color:var(--mu)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--tx);display:flex;gap:10px;max-width:560px;margin:0 auto}
.bar .bt{flex:1}
.hd{margin:16px;padding:14px 16px;background:var(--card);border:1px solid var(--ln);border-radius:6px}
.hd h2{margin:0 0 4px;font-size:1.2rem}
.hd .num{font-size:2.2rem}
.mv small{color:var(--mu);display:block}
dialog{border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);width:min(92vw,380px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 12px}
dialog .acts{display:flex;gap:10px;margin-top:16px}
dialog .acts .bt{flex:1}
.tg{display:flex;gap:8px;margin-bottom:12px}
.tg button{flex:1;padding:12px;border:2px solid var(--ln);border-radius:8px;background:none;color:var(--tx);font-weight:600}
.tg button.on.D{border-color:var(--de);background:var(--de);color:#fff}
.tg button.on.P{border-color:var(--pa);background:var(--pa);color:#fff}
dialog input{margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
</style></head>
<body>
<div class="app">
<header>
  <button class="ib" id="back" hidden aria-label="Volver">←</button>
  <h1 id="ttl"></h1>
  <button class="ib" id="lang"></button>
</header>

<section id="vL">
  <div class="tot"><small data-k="tot"></small><div class="num" id="total"></div></div>
  <div class="q"><input id="q" data-p="buscar" autocomplete="off"></div>
  <div id="list"></div>
  <div class="bar">
    <button class="bt s" id="bCfg" data-k="cfg"></button>
    <button class="bt" id="bNew" data-k="nuevoC"></button>
  </div>
</section>

<section id="vD" hidden>
  <div class="hd"><h2 id="dn"></h2><small data-k="saldo"></small><div class="num" id="ds"></div></div>
  <div id="mvs"></div>
  <div class="bar">
    <button class="bt r" id="bDel" data-k="elim"></button>
    <button class="bt" id="bMov" data-k="nuevoM"></button>
  </div>
</section>
</div>

<dialog id="dC"><h3 data-k="nuevoC"></h3>
  <input id="cName" data-p="nombre" autocomplete="off">
  <div class="acts"><button class="bt s" data-close data-k="cancel"></button><button class="bt" id="okC" data-k="guardar"></button></div>
</dialog>

<dialog id="dM"><h3 data-k="nuevoM"></h3>
  <div class="tg"><button class="D" data-t="D" data-k="deuda"></button><button class="P" data-t="P" data-k="pago"></button></div>
  <input id="mAmt" inputmode="decimal" data-p="importe" autocomplete="off">
  <small id="mDate"></small>
  <div class="acts"><button class="bt s" data-close data-k="cancel"></button><button class="bt" id="okM" data-k="guardar"></button></div>
</dialog>

<dialog id="dS"><h3 data-k="cfg"></h3>
  <input id="sName" data-p="local" autocomplete="off">
  <div class="acts"><button class="bt s" data-close data-k="cancel"></button><button class="bt" id="okS" data-k="guardar"></button></div>
</dialog>

<dialog id="dX"><h3 data-k="elim"></h3><p id="xTxt"></p>
  <div class="acts"><button class="bt s" data-close data-k="cancel"></button><button class="bt r" id="okX" data-k="elim"></button></div>
</dialog>

<div id="toast"></div>

<script>
const T={
es:{tot:"Total adeudado",buscar:"Buscar cliente…",nuevoC:"Nuevo cliente",cfg:"Nombre del local",elim:"Eliminar",nuevoM:"Nuevo movimiento",saldo:"Saldo",deuda:"Deuda",pago:"Pago",importe:"Importe",nombre:"Apellido, Nombre",local:"Ej: Almacén Don Pedro",guardar:"Guardar",cancel:"Cancelar",vacio:"Todavía no hay clientes. Tocá Nuevo cliente.",sinMov:"Sin movimientos todavía.",seguro:"¿Eliminar a",existe:"Ese cliente ya existe",falta:"Escribí un nombre",monto:"Ingresá un importe",ok:"Guardado",fecha:"Fecha",deu:"Deuda",pag:"Pago",nro:"Nro"},
zh:{tot:"欠款总额",buscar:"搜索客户…",nuevoC:"新客户",cfg:"店名",elim:"删除",nuevoM:"新记录",saldo:"余额",deuda:"赊账",pago:"还款",importe:"金额",nombre:"姓名",local:"例如：小王超市",guardar:"保存",cancel:"取消",vacio:"还没有客户。点击“新客户”。",sinMov:"暂无记录。",seguro:"确定删除",existe:"该客户已存在",falta:"请输入姓名",monto:"请输入金额",ok:"已保存",fecha:"日期",deu:"赊账",pag:"还款",nro:"第"}
};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function ago(n){const d=new Date();d.setDate(d.getDate()-n);return iso(d)}
function demo(){return{local:"Mis Deudores",lang:"es",c:[
{n:"García, Luis",m:[{t:"D",i:18000,f:ago(22)},{t:"P",i:2800,f:ago(8)}]},
{n:"López, María",m:[{t:"D",i:8500,f:ago(13)}]},
{n:"Martínez, Juan",m:[{t:"D",i:5000,f:ago(30)},{t:"P",i:1800,f:ago(18)}]},
{n:"Pérez, Ana",m:[{t:"D",i:4000,f:ago(21)},{t:"P",i:4000,f:ago(3)}]},
{n:"Rodríguez, Carlos",m:[{t:"D",i:22000,f:ago(5)}]}]}}
function load(){try{const r=localStorage.getItem("misdeudores1");if(r){const o=JSON.parse(r);if(o&&o.c)return o}}catch(e){}return demo()}
let S=load();
function save(){try{localStorage.setItem("misdeudores1",JSON.stringify(S))}catch(e){}}
const t=k=>T[S.lang][k];
const money=n=>"$ "+Math.round(n).toLocaleString("es-AR");
const bal=c=>c.m.reduce((a,x)=>a+(x.t==="D"?x.i:-x.i),0);
const fd=s=>{const p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]};
let cur=-1,mt="D";

function toast(k){const e=$("#toast");e.textContent=t(k);e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}

function render(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll("[data-k]").forEach(e=>e.textContent=t(e.dataset.k));
  document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));
  $("#lang").textContent=S.lang==="zh"?"ES":"中文";
  const inList=cur<0;
  $("#vL").hidden=!inList;$("#vD").hidden=inList;$("#back").hidden=inList;
  $("#ttl").textContent=inList?S.local:S.c[cur].n;
  if(inList){
    $("#total").textContent=money(S.c.reduce((a,c)=>a+bal(c),0));
    const f=$("#q").value.trim().toLowerCase();
    const rows=S.c.map((c,i)=>({c,i})).filter(x=>x.c.n.toLowerCase().includes(f));
    $("#list").innerHTML=rows.length?rows.map(x=>{const b=bal(x.c);return `<button class="row" data-i="${x.i}"><span class="n">${esc(x.c.n)}</span><span class="num ${b>0?"d":"p"}">${money(b)}</span></button>`}).join(""):`<div class="empty">${t("vacio")}</div>`;
  }else{
    const c=S.c[cur],b=bal(c);
    $("#dn").textContent=c.n;
    $("#ds").textContent=money(b);$("#ds").className="num "+(b>0?"d":"p");
    $("#mvs").innerHTML=c.m.length?c.m.map((x,k)=>({x,k})).reverse().map(o=>`<div class="row mv"><span><b class="${o.x.t==="D"?"d":"p"}">${o.x.t==="D"?t("deu"):t("pag")}</b><small>${t("fecha")}: ${fd(o.x.f)}</small></span><span class="num ${o.x.t==="D"?"d":"p"}">${o.x.t==="D"?"+":"−"} ${money(o.x.i)}</span></div>`).join(""):`<div class="empty">${t("sinMov")}</div>`;
  }
}

function setType(v){mt=v;document.querySelectorAll(".tg button").forEach(b=>b.classList.toggle("on",b.dataset.t===v));document.querySelectorAll(".tg button").forEach(b=>{if(b.dataset.t===v)b.classList.add(v)})}

$("#list").addEventListener("click",e=>{const r=e.target.closest(".row");if(r){cur=+r.dataset.i;render();window.scrollTo(0,0)}});
$("#back").onclick=()=>{cur=-1;render()};
$("#q").oninput=render;
$("#lang").onclick=()=>{S.lang=S.lang==="zh"?"es":"zh";save();render()};
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest("dialog").close());

$("#bNew").onclick=()=>{$("#cName").value="";$("#dC").showModal()};
$("#okC").onclick=()=>{
  const n=$("#cName").value.trim();
  if(!n){toast("falta");return}
  if(S.c.some(c=>c.n.toLowerCase()===n.toLowerCase())){toast("existe");return}
  S.c.push({n,m:[]});S.c.sort((a,b)=>a.n.localeCompare(b.n,"es"));
  save();$("#dC").close();render();toast("ok");
};
$("#bCfg").onclick=()=>{$("#sName").value=S.local;$("#dS").showModal()};
$("#okS").onclick=()=>{const v=$("#sName").value.trim();if(v){S.local=v;save();render();toast("ok")}$("#dS").close()};

$("#bMov").onclick=()=>{$("#mAmt").value="";setType("D");$("#mDate").textContent=t("fecha")+": "+fd(iso(new Date()));$("#dM").showModal()};
document.querySelectorAll(".tg button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tg button").forEach(x=>x.classList.remove("D","P"));setType(b.dataset.t)});
$("#okM").onclick=()=>{
  const a=parseFloat($("#mAmt").value.replace(",","."));
  if(!(a>0)){toast("monto");return}
  S.c[cur].m.push({t:mt,i:a,f:iso(new Date())});
  save();$("#dM").close();render();toast("ok");
};
$("#bDel").onclick=()=>{$("#xTxt").textContent=t("seguro")+" "+S.c[cur].n+(S.lang==="zh"?"？":"?");$("#dX").showModal()};
$("#okX").onclick=()=>{S.c.splice(cur,1);cur=-1;save();$("#dX").close();render()};

render();
</script>
</body></html>
